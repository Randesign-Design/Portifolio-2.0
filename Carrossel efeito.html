<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Scroll Horizontal Portfólio</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* SEÇÃO */
.horizontal-section {
  position: relative;
  height: auto;
  width: 100%;
  overflow: hidden;
}

/* ÁREA FIXA */
.horizontal-track {
  position: sticky;
  top: 0;
  width: max-content;
  height: auto;
  display: flex;
  align-items: center;
  gap: 80px;
  padding: 0 10vw;
  
  overflow: hidden;
}

/* ITENS */
.item{
  flex: 0 0 70vw;
}

.item img {
  width: 100%;
  height: 70vh;
  object-fit: cover;
  border-radius: 24px;
}
</style>
</head>

<body>

    <section id="projetos" class="container">
    <h2>Meus Projetos</h2>
    <div class="projetos-grid">


        
      <div class="capa-video">
        <h3>Posts para Instagram</h3>
        <video muted src="imagens/Img site/Capa posts site.mp4" class="capa"></video>
        <i class="fa-solid fa-play"></i>
        <p>Posts feitos para instagram</p>
        <a href="posts.html">Ver mais</a>

      </div>


 <div class="capa-video">
        <h3>Logos</h3>
        <video muted src="imagens/Img site/Capa Logos site.mp4" class="capa"></video>
        <i class="fa-solid fa-play"></i>
        <p> Logos para fotos de perfil de midias sociais</p>
        <a href="logos.html">Ver mais</a>

    </div>


      <!--Flyers esportivos-->
      <div class="capa-video">
        
      
        <h3>Flyers Esportivos</h3>
       <video muted src="imagens/Img site/capa site flyer.mp4" class="capa">  </video>
       <i class="fa-solid fa-play"></i>
        <p>Desenvolvimento e estudo de flyers esportivos para  posts de instagram</p>
        <a href="Flyers esportivos.html">Ver mais</a>
      </div>


    <section class="horizontal-section">
  <div class="horizontal-track">
    <div class="item"><img src="https://picsum.photos/id/1015/1200/800"></div>
    <div class="item"><img src="https://picsum.photos/id/1016/1200/800"></div>
    <div class="item"><img src="https://picsum.photos/id/1018/1200/800"></div>
    <div class="item"><img src="https://picsum.photos/id/1020/1200/800"></div>
  </div>
</section>

<script>
const section = document.querySelector('.horizontal-section');
const track = document.querySelector('.horizontal-track');

let currentX = 0;
const maxScroll = track.scrollWidth - window.innerWidth;

section.addEventListener('wheel', (e) => {
  e.preventDefault(); // BLOQUEIA scroll vertical

  currentX += e.deltaY * 0.8;
  currentX = Math.max(0, Math.min(currentX, maxScroll));

  track.style.transform = `translateX(${-currentX}px)`;

}, { passive: false });
</script>
</body>
</html>
